global:
  scrape_interval: 15s

rule_files:
  - "rules/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "secure-platform-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:3000